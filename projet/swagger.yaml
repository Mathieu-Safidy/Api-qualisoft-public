openapi: 3.0.0
info:
  title: Authentification API
  version: 1.0.0
  description: Documentation de l'API d'authentification
servers:
  - url: http://localhost:5000
paths:
  /login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                mode:
                  type: string
                  enum: [ldap, gpao]
      responses:
        '200':
          description: Connexion réussie
        '401':
          description: Erreur lors de la connexion
        '404':
          description: Accès non autorisé3
  /verify:
    get:
      summary: Vérifie la validité du token JWT
      description: >
        Endpoint protégé qui vérifie si le token JWT est valide.
        Retourne les informations utilisateur si le token est valide,
        sinon une erreur 401.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token valide, accès autorisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user:
                    type: object
                    description: Informations décodées du token
        '401':
          description: Token manquant ou invalide
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Token invalide ou expiré. Veuillez vous reconnecter."