name: Qualisoft Backend Deployment
run-name: Runned by ${{ github.actor }} 🚀
on:
  release:
    types: [published]

env:
  APP_NAME: qualisoft-microservice
  REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
  IMAGE_TAG: ${{ github.sha }}
  REMOTE_K8S_MANIFESTS_DIR: ${{ secrets.REMOTE_K8S_MANIFESTS_DIR }}/${{ secrets.REGISTRY_USERNAME }}/qualisoft-microservice:${{ github.sha }}
  K8S_CONTROL_PLANE: ${{ secrets.K8S_CONTROL_PLANE }}
  PROCESSED_K8S_DIR: _k8s_processed
  IMAGE_NAME: qualisoft-microservice
  APP_ROUTE: qualisoft-microservice
  K8S_MANIFESTS_FOLDER: k8s
  NAMESPACE: luminess-microservice
  SERVICE_PORT: 80
  CONTAINER_PORT: 5000

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./projet
          file: ./projet/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ env.APP_NAME }}
          network: host

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure Namespace Exists
        shell: powershell
        run: |
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or Update Docker Registry Secret
        shell: powershell
        run: |
          kubectl create secret docker-registry regcred --namespace $env:NAMESPACE --docker-server="$env:REGISTRY_HOST" --docker-username="$env:REGISTRY_USERNAME" --docker-password="$env:REGISTRY_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -

      - name: Process Kubernetes Manifests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:PROCESSED_K8S_DIR
          Get-ChildItem $env:K8S_MANIFESTS_FOLDER -Filter *.yaml | ForEach-Object {
              $file = $_.FullName
              $filename = $_.Name
              $content = Get-Content $file -Raw
              $content = $content -replace '{{REGISTRY_HOST}}', $env:REGISTRY_HOST
              $content = $content -replace '{{APP_NAME}}', $env:APP_NAME
              $content = $content -replace '{{APP_ROUTE}}', $env:APP_ROUTE
              $content = $content -replace '{{NAMESPACE}}', $env:NAMESPACE
              $content = $content -replace '{{SERVICE_PORT}}', "$($env:SERVICE_PORT)"
              $content = $content -replace '{{CONTAINER_PORT}}', "$($env:CONTAINER_PORT)"
              $outputFile = Join-Path $env:PROCESSED_K8S_DIR $filename
              $content | Set-Content -Path $outputFile
              Write-Host "Processed $filename"
          }

      - name: Apply Kubernetes Manifests Locally
        shell: powershell
        run: |
          kubectl apply -f "$env:PROCESSED_K8S_DIR\namespace.yaml"
          kubectl apply -f "$env:PROCESSED_K8S_DIR\"

      - name: Upload K8s manifests artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8s-artifacts
          path: ${{ env.PROCESSED_K8S_DIR }}
          retention-days: 2


